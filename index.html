<!DOCTYPE html>
<html>
  <head>
    <title>Проект "Комменты"</title>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <div class="container">
      <ul class="comments">
        <li class="comment">
          <div class="comment-header">
            <div>Глеб Фокин</div>
            <div>12.02.22 12:18</div>
          </div>
          <div class="comment-body">
            <div class="comment-text">
              Это будет первый комментарий на этой странице
            </div>
          </div>
          <div class="comment-footer">
            <div class="likes">
              <span class="likes-counter">3</span>
              <button class="like-button"></button>
            </div>
          </div>
        </li>
        <li class="comment">
          <div class="comment-header">
            <div>Варвара Н.</div>
            <div>13.02.22 19:22</div>
          </div>
          <div class="comment-body">
            <div class="comment-text">
              Мне нравится как оформлена эта страница! ❤
            </div>
          </div>
          <div class="comment-footer">
            <div class="likes">
              <span class="likes-counter">75</span>
              <button class="like-button -active-like"></button>
            </div>
          </div>
        </li>
      </ul>
      <div class="add-form">
        <input
          type="text"
          class="add-form-name"
          placeholder="Введите ваше имя"
        />
        <textarea
          type="textarea"
          class="add-form-text"
          placeholder="Введите ваш коментарий"
          rows="4"
        ></textarea>
        <div class="add-form-row">
          <button class="add-form-button">Написать</button>
        </div>
      </div>
    </div>
  </body>

  <script>
    "use strict";
    // Код писать здесь

   // Элементы DOM
const nameInput = document.querySelector('.add-form-name');
const textInput = document.querySelector('.add-form-text');
const addButton = document.querySelector('.add-form-button');
const commentsList = document.querySelector('.comments');

// Массив комментариев с экранированными данными
let comments = [
  {
    id: 1,
    name: "Глеб Фокин",
    date: "12.02.22 12:18",
    text: "Это будет первый комментарий на этой странице",
    likes: 3,
    isLiked: false
  },
  {
    id: 2,
    name: "Варвара Н.",
    date: "13.02.22 19:22",
    text: "Мне нравится как оформлена эта страница! ❤",
    likes: 75,
    isLiked: true
  }
];

// Функция экранирования HTML
function escapeHtml(text) {
  if (!text) return '';
  return text
    .replaceAll('&', '&amp;')   
    .replaceAll('<', '&lt;')
    .replaceAll('>', '&gt;')
    .replaceAll('"', '&quot;')
    .replaceAll("'", '&#039;');
}

// Функция получения текущей даты
function getCurrentDate() {
  const now = new Date();
  const day = String(now.getDate()).padStart(2, '0');
  const month = String(now.getMonth() + 1).padStart(2, '0');
  const year = String(now.getFullYear()).slice(-2);
  const hours = String(now.getHours()).padStart(2, '0');
  const minutes = String(now.getMinutes()).padStart(2, '0');
  
  return `${day}.${month}.${year} ${hours}:${minutes}`;
}

// Функция цитирования комментария
function quoteComment(index) {
  const comment = comments[index];
  
  //  специальное экранирование для textarea
  // (нельзя использовать <br>)
  const textForTextarea = comment.text.replace(/<br\s*\/?>/gi, '\n');
  
  const textLines = textForTextarea.split('\n');
  const quotedLines = textLines.map(line => `> ${line}`).join('\n');
  const quotedText = `> ${comment.name}:\n${quotedLines}\n\n`;
  
  textInput.value = quotedText + textInput.value;
  textInput.focus();
  textInput.scrollIntoView({ behavior: 'smooth' });
}

// Функция рендеринга комментариев
function renderComments() {
  const commentsHtml = comments.map((comment, index) => {
    // Данные УЖЕ экранированы в массиве
    const formattedText = comment.text.replace(/\n/g, '<br>');
    const likeClass = comment.isLiked ? '-active-like' : '';
    
    return `
      <li class="comment" data-index="${index}">
        <div class="comment-header">
          <div>${comment.name}</div>  <!-- уже экранировано -->
          <div>${comment.date}</div>
        </div>
        <div class="comment-body">
          <div class="comment-text">
            ${formattedText}  <!-- уже экранировано + <br> -->
          </div>
        </div>
        <div class="comment-footer">
          <div class="likes">
            <span class="likes-counter">${comment.likes}</span>
            <button class="like-button ${likeClass}" data-index="${index}"></button>
          </div>
        </div>
      </li>
    `;
  }).join('');
  
  commentsList.innerHTML = commentsHtml;
  addEventListeners();
}

// Функция для добавления всех обработчиков
function addEventListeners() {
  const commentElements = document.querySelectorAll('.comment');
  commentElements.forEach((commentElement) => {
    commentElement.addEventListener('click', (event) => {
      if (event.target.closest('.like-button')) {
        return;
      }
      
      const index = parseInt(commentElement.dataset.index);
      if (!isNaN(index)) {
        quoteComment(index);
      }
    });
  });
  
  const likeButtons = document.querySelectorAll('.like-button');
  likeButtons.forEach((button) => {
    button.addEventListener('click', (event) => {
      event.stopPropagation();
      const index = parseInt(button.dataset.index);
      toggleLike(index);
    });
  });
}

// Функция переключения лайка
function toggleLike(index) {
  if (comments[index].isLiked) {
    comments[index].likes -= 1;
    comments[index].isLiked = false;
  } else {
    comments[index].likes += 1;
    comments[index].isLiked = true;
  }
  
  renderComments();
}

// Функция добавления комментария
function addComment() {
  const nameValue = nameInput.value.trim();
  const textValue = textInput.value.trim();
  
  if (!nameValue) {
    alert('Пожалуйста, введите ваше имя');
    nameInput.focus();
    return;
  }
  
  if (!textValue) {
    alert('Пожалуйста, введите текст комментария');
    textInput.focus();
    return;
  }
  
  const lines = textValue.split('\n');
  const onlyQuote = lines.every(line => {
    const trimmedLine = line.trim();
    return !trimmedLine || trimmedLine.startsWith('>');
  });
  
  if (onlyQuote) {
    alert('Пожалуйста, добавьте свой текст к цитате');
    textInput.focus();
    return;
  }
  
  // Экранируем данные ПЕРЕД сохранением в массив
  const safeName = escapeHtml(nameValue);
  const safeText = escapeHtml(textValue);
  
  comments.push({
    id: Date.now(),
    name: safeName,  
    date: getCurrentDate(),
    text: safeText,  
    likes: 0,
    isLiked: false
  });
  
  nameInput.value = '';
  textInput.value = '';
  nameInput.focus();
  
  renderComments();
}

// Инициализация
addButton.addEventListener('click', addComment);

textInput.addEventListener('keydown', function(event) {
  if (event.key === 'Enter' && !event.shiftKey) {
    event.preventDefault();
    addComment();
  }
});

// Экранируем начальные данные
comments = comments.map(comment => ({
  ...comment,
  name: escapeHtml(comment.name),
  text: escapeHtml(comment.text)
}));

// Первоначальный рендеринг
renderComments();


  </script>
</html>
